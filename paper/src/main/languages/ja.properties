kansokusha.command.inspect.enabled=<gray>調査モードを<green>有効</green>にしました。左クリックでブロックの履歴、右クリックでその面の先の座標の履歴を表示します。<newline><aqua>/kansokusha inspect off</aqua> で通常のブロック操作に戻れます。</gray>
kansokusha.command.inspect.disabled=<gray>調査モードを<red>無効</red>にしました。通常のブロック操作に戻りました。</gray>
