name: Kansokusha
version: '${projectVersion}'
description: Kansokusha is a plugin for Minecraft that logs player actions.
main: net.okocraft.kansokusha.paper.plugin.KansokushaPaperPlugin
api-version: '1.21'
folia-supported: true

permissions:
  kansokusha.command.teleport:
    description: Teleport to recorded block coordinates
    default: op
