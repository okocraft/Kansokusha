kansokusha.command.help.header=<gold>Kansokusha コマンド</gold>
kansokusha.command.help.version=<aqua>/kansokusha version</aqua><dark_gray> - </dark_gray><gray>プラグインのバージョンを表示する</gray>
kansokusha.command.help.search=<aqua>/kansokusha search [query]</aqua><dark_gray> - </dark_gray><gray>複数の記録を比較・調査する。例: /kansokusha search user Alice time 1d。結果をクリックすると詳細を表示</gray>
kansokusha.command.help.event=<aqua>/kansokusha event \\<event-id></aqua><dark_gray> - </dark_gray><gray>1件の記録の変更前後・原因などを調査する。ID は検索結果から取得</gray>
kansokusha.command.search.parse-error=<red>検索条件が正しくありません。<reason></red>
kansokusha.command.search.event-permission=<red>イベント <aqua><event></aqua> を検索する権限がありません。サーバー管理者にお問い合わせください。</red>
kansokusha.command.search.limit-range=<red><aqua>limit</aqua> は <aqua>1</aqua> から <aqua><max></aqua> の範囲で指定してください。</red>
kansokusha.command.search.failed=<red>イベントの検索に失敗しました。サーバー管理者にお問い合わせください。</red>
kansokusha.command.search.no-results=<gray>一致するイベントは見つかりませんでした。条件を減らすか、期間を広げて検索してください。</gray>
kansokusha.command.search.result=<gray><line></gray>
kansokusha.command.search.previous=<gold>[前へ]</gold>
