kansokusha.command.search.reason.missing=<red><aqua><field></aqua> の値を指定してください。</red>
kansokusha.command.search.reason.duplicate=<red><aqua><field></aqua> は一度だけ指定してください。</red>
kansokusha.command.search.reason.time-conflict=<red><aqua>time</aqua> と <aqua>from/to</aqua> はどちらか一方を指定してください。</red>
kansokusha.command.search.reason.time-order=<red><aqua>from</aqua> は <aqua>to</aqua> より前にしてください。</red>
kansokusha.command.search.reason.radius-unavailable=<red><aqua>radius</aqua> は Paper/Folia のゲーム内で使用してください。または <aqua>around</aqua> でワールドと座標を指定してください。</red>
kansokusha.command.search.reason.unknown-condition=<red>条件 <aqua><field></aqua> は使用できません。Tab 補完で条件を選択してください。</red>
kansokusha.command.search.reason.invalid-order=<red><aqua>order</aqua> の値 <aqua><value></aqua> は正しくありません。<aqua>newest</aqua> または <aqua>oldest</aqua> を指定してください。</red>
kansokusha.command.search.reason.invalid-actor-kind=<red><aqua>actor-kind</aqua> の値 <aqua><value></aqua> は正しくありません。<aqua>player</aqua>、<aqua>entity</aqua>、<aqua>block</aqua> のいずれかを指定してください。</red>
kansokusha.command.search.reason.invalid-uuid=<red><aqua>actor-uuid</aqua> の値 <aqua><value></aqua> は正しくありません。UUID を指定してください。</red>
kansokusha.command.search.reason.invalid-key=<red><aqua><field></aqua> の値 <aqua><value></aqua> は正しくありません。<aqua>minecraft:stone</aqua> のような小文字の識別子を指定してください。</red>
kansokusha.command.search.reason.positive-integer=<red><aqua><field></aqua> は正の整数で指定してください。<aqua><value></aqua> は使用できません。</red>
kansokusha.command.search.reason.invalid-integer=<red><aqua><field></aqua> は <aqua>-2147483648</aqua> から <aqua>2147483647</aqua> の整数で指定してください。<aqua><value></aqua> は使用できません。</red>
kansokusha.command.search.reason.empty=<red><aqua><field></aqua> に空でない値を指定してください。</red>
kansokusha.command.search.reason.time-out-of-range=<red>日時または期間の値 <aqua><value></aqua> が範囲外です。期間を短くするか、対応する日時を指定してください。</red>
kansokusha.command.search.reason.invalid-time-range=<red>期間 <aqua><value></aqua> は正しくありません。<aqua>2h-1h</aqua> のように異なる期間を指定してください。</red>
kansokusha.command.search.reason.invalid-duration=<red>期間 <aqua><value></aqua> は正しくありません。<aqua>1h30m</aqua> のように <aqua>m/h/d/w</aqua> を使った正の期間を指定してください。</red>
kansokusha.command.search.reason.invalid-date=<red>日時 <aqua><value></aqua> は正しくありません。<aqua>YYYY-MM-DD</aqua> または <aqua>YYYY-MM-DDTHH:MM:SS</aqua> の形式で指定してください。時差も指定できます。</red>
kansokusha.command.search.reason.incomplete-escape=<red>検索条件の末尾のエスケープが未完了です。エスケープする文字を追加するか、末尾のバックスラッシュを削除してください。</red>
kansokusha.command.search.reason.unterminated-quote=<red>検索条件の引用符が閉じられていません。閉じる引用符を追加してください。</red>
kansokusha.command.search.reason.invalid-cursor=<red>ページのリンクが正しくありません。条件を指定して <aqua>/kansokusha search</aqua> を再実行してください。</red>
