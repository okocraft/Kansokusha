kansokusha.command.event.invalid-id=<red>イベント ID が正しくありません。検索結果から UUID 全体をコピーするか、結果をクリックして詳細を表示してください。</red>
kansokusha.command.event.not-found=<red>イベントが見つかりませんでした。このサーバーまたはプロキシで再検索してください。保存期間が過ぎている可能性があります。</red>
