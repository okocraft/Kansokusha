[versions]
# libraries
annotations = "26.1.0"
adventure = "4.26.1"
configurate = "4.2.0"
duckdb = "1.5.5.1"

# platform api
paper = "26.2.build.125-stable"
velocity = "4.2.0"

# testing tool
junit = "6.1.3"

# testing environment
mockito = "5.23.0"

# gradle plugins
paperweight-userdev = "2.0.0-beta.23"
run-server = "3.1.0"
gradle-plugins = "1.8.6"

[libraries]

# libraries
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
adventure-key = { module = "net.kyori:adventure-key", version.ref = "adventure" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
duckdb-jdbc = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }

# platform api
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
velocity = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }

# testing tool
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

# testing environment
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]

paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight-userdev" }
run-server = { id = "xyz.jpenilla.run-paper", version.ref = "run-server" }
run-velocity = { id = "xyz.jpenilla.run-velocity", version.ref = "run-server" }
bundler = { id = "dev.siroshun.gradle.plugins.bundler", version.ref = "gradle-plugins" }
jcommon = { id = "dev.siroshun.gradle.plugins.jcommon", version.ref = "gradle-plugins" }
