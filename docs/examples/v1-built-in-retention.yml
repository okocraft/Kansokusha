# Operator-facing example for the v1 built-in event catalog.
# This file is not copied into the generated config skeleton automatically.
retention:
  policies:
    - key: kansokusha:audit
      duration: P180D
    - key: kansokusha:session
      duration: P30D
    - key: kansokusha:default
      duration: P30D
  event-type-mappings:
    - event-type: kansokusha:block_break
      policy: kansokusha:audit
    - event-type: kansokusha:block_place
      policy: kansokusha:audit
    - event-type: kansokusha:sign_change
      policy: kansokusha:audit
    - event-type: kansokusha:bucket_empty
      policy: kansokusha:audit
    - event-type: kansokusha:bucket_fill
      policy: kansokusha:audit
    - event-type: kansokusha:block_harvest
      policy: kansokusha:audit
    - event-type: kansokusha:flower_pot_change
      policy: kansokusha:audit
    - event-type: kansokusha:server_connected
      policy: kansokusha:session
  fallback-policy: kansokusha:default
  # Cleanup cadence/batch size are illustrative operational values, not catalog decisions.
  cleanup-interval: PT5M
  max-rows-per-pass: 1000
