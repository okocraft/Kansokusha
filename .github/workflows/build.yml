name: Build
on: [ push, pull_request ]

jobs:
  build:
    uses: okocraft/workflows/.github/workflows/gradle.yml@v1
    with:
      java-version: '25'
      package-name: Kansokusha-Build-${{ github.run_number }}
      artifact-directory: "./build/libs"
      build-arguments: verifyV1
      upload-test-results: true
